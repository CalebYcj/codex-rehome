name: ReHome Desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm test -- --run
      - working-directory: desktop
        run: npm run build
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # macOS exposes its default temporary directory through /var, a symlink.
      # The product correctly rejects symlinked restore ancestry and excludes
      # temporary folders from package sources, so tests use a physical directory
      # inside the checked-out workspace rather than weakening either safeguard.
      - if: runner.os == 'macOS'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rehome-ci-scratch"
          TMPDIR="$GITHUB_WORKSPACE/rehome-ci-scratch" cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - if: runner.os != 'macOS'
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/readme_language_test.ps1

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm run tauri build -- --bundles nsis
      - name: Package ZIP fallback
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Compress-Archive -LiteralPath $installer.FullName -DestinationPath "$($installer.DirectoryName)/$($installer.BaseName).zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: ReHome-Desktop-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.zip

  macos-installer:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ReHome-Desktop-macOS-Universal
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows-installer, macos-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
