name: ReHome Desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm test -- --run
      - working-directory: desktop
        run: npm run build
      - run: node --test scripts/generate-updater-json.test.mjs
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # macOS exposes its default temporary directory through /var, a symlink.
      # The product correctly rejects symlinked restore ancestry and excludes
      # temporary folders from package sources, so tests use a physical directory
      # inside the checked-out workspace rather than weakening either safeguard.
      - if: runner.os == 'macOS'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rehome-ci-scratch"
          TMPDIR="$GITHUB_WORKSPACE/rehome-ci-scratch" cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - if: runner.os != 'macOS'
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/readme_language_test.ps1

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: desktop
        run: npm ci
      - name: Build Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis
      - name: Build signed Windows updater
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Stage Windows release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination release-assets
          Compress-Archive -LiteralPath $installer.FullName -DestinationPath "release-assets/$($installer.BaseName).zip" -CompressionLevel Optimal
          $signature = "$($installer.FullName).sig"
          if (Test-Path -LiteralPath $signature) {
            Copy-Item -LiteralPath $signature -Destination release-assets
          }
      - uses: actions/upload-artifact@v7
        with:
          name: ReHome-Desktop-Windows-x64
          path: release-assets/*

  macos-installer:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - working-directory: desktop
        run: npm ci
      - name: Build macOS installer
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        working-directory: desktop
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - name: Build signed macOS updater
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Stage macOS release files
        run: |
          mkdir -p release-assets
          cp desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
      - name: Stage signed macOS updater
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          shopt -s nullglob
          updater_bundles=(desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          updater_signatures=(desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig)
          if [[ ${#updater_bundles[@]} -ne 1 || ${#updater_signatures[@]} -ne 1 ]]; then
            echo "Expected exactly one signed macOS updater bundle, found ${#updater_bundles[@]} bundle(s) and ${#updater_signatures[@]} signature(s)." >&2
            exit 1
          fi
          cp "${updater_bundles[0]}" release-assets/
          cp "${updater_signatures[0]}" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: ReHome-Desktop-macOS-Universal
          path: release-assets/*

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows-installer, macos-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate updater manifest
        run: node scripts/generate-updater-json.mjs release-assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
