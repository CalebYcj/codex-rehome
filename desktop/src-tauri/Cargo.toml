[package]
name = "rehome-desktop"
version = "0.1.4"
description = "ReHome Desktop migration utility"
authors = ["ReHome contributors"]
edition = "2021"

[lib]
name = "rehome_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
tempfile = "3"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
walkdir = "2"
zip = { version = "4.6", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-updater = "2"
